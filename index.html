<div class="container">
  <!-- Pantalla inicial -->
  <div id="intro-card" class="card">
    <p class="message">No es mucho pero es mi detalle para ti.</p>
    <button id="open-btn" onclick="openGift()">Abrir regalo</button>
  </div>

  <!-- Pantalla de las flores -->
  <div id="flower-container" class="flower-container hidden">
    <div class="bouquet">
      <!-- Tallo 1 -->
      <div class="stem s1">
        <div class="leaf left"></div>
        <div class="flower f1">
          <div class="center"></div>
          <div class="petals"></div>
        </div>
      </div>
      <!-- Tallo 2 -->
      <div class="stem s2">
        <div class="leaf right"></div>
        <div class="flower f2">
          <div class="center"></div>
          <div class="petals"></div>
        </div>
      </div>
      <!-- Tallo 3 (Centro) -->
      <div class="stem s3">
        <div class="leaf left"></div>
        <div class="flower f3">
          <div class="center"></div>
          <div class="petals"></div>
        </div>
      </div>
      <!-- Tallo 4 -->
      <div class="stem s4">
        <div class="leaf right"></div>
        <div class="flower f4">
          <div class="center"></div>
          <div class="petals"></div>
        </div>
      </div>
      <!-- Tallo 5 -->
      <div class="stem s5">
        <div class="leaf left"></div>
        <div class="flower f5">
          <div class="center"></div>
          <div class="petals"></div>
        </div>
      </div>
      <!-- Laño / Listón -->
      <div class="ribbon"></div>
    </div>
  </div>
</div>
